name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  server-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to avoid deprecation
          cache: npm

      - name: Install dependencies
        run: npm install

      # We use 'npm test' because your package.json has a test script defined
      - name: Test server
        run: npm test

  ai-service-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # This triggers your ingestNews.js to ensure the AI logic works
      - name: Validate AI Ingestion
        run: node scripts/ingestNews.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}